version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proviemplea_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - proviemplea_network

  web:
    image: nginx:latest
    container_name: proviemplea_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - proviemplea_network

  db:
    image: mysql:8.0
    container_name: proviemplea_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: proviemplea
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - proviemplea_network

networks:
  proviemplea_network:
    driver: bridge

volumes:
  dbdata:
